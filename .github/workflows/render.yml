name: Render Remotion Video in Parallel Chunks

on:
  workflow_dispatch:
    inputs:
      composition_id:
        description: 'Remotion Composition ID to render'
        required: true
        default: 'DocumentaryTemplate'
        type: string

jobs:
  # =========================================================================
  # JOB 1: Parallel Video Chunk Render Matrix (900 frames per job, muted)
  # =========================================================================
  render-chunks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - { index: 0, startFrame: 0, endFrame: 899 }
          - { index: 1, startFrame: 900, endFrame: 1799 }

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install official Remotion headless Chrome Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgcc1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            ca-certificates \
            fonts-liberation \
            libappindicator3-1 \
            libnss3 \
            lsb-release \
            xdg-utils \
            wget \
            ffmpeg

      - name: Clean install npm dependencies
        run: npm ci

      - name: Validate all required images, audio, and font assets exist
        run: node scripts/check-assets.js

      - name: Create output directory
        run: mkdir -p out

      - name: Render Chunk ${{ matrix.chunk.index }} (Frames ${{ matrix.chunk.startFrame }} to ${{ matrix.chunk.endFrame }})
        run: |
          npx remotion render src/index.jsx ${{ inputs.composition_id }} out/chunk-${{ matrix.chunk.index }}.mp4 \
            --frames=${{ matrix.chunk.startFrame }}-${{ matrix.chunk.endFrame }} \
            --concurrency=2 \
            --crf=16 \
            --muted

      - name: Upload Chunk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-chunk-${{ matrix.chunk.index }}
          path: out/chunk-${{ matrix.chunk.index }}.mp4
          retention-days: 1

  # =========================================================================
  # JOB 2: Render Audio Track, Join Chunks with FFmpeg, and Export Final MP4
  # =========================================================================
  merge-and-finish:
    needs: render-chunks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg & Chrome Linux dependencies for audio rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2t64 libnss3 libgbm1

      - name: Clean install npm dependencies
        run: npm ci

      - name: Validate all assets exist before audio rendering
        run: node scripts/check-assets.js

      - name: Create working directory
        run: mkdir -p out chunks

      - name: Download all video chunk artifacts
        uses: actions/download-artifact@v4
        with:
          path: chunks

      - name: Organize downloaded chunks into out folder
        run: |
          cp chunks/video-chunk-0/chunk-0.mp4 out/chunk-0.mp4
          cp chunks/video-chunk-1/chunk-1.mp4 out/chunk-1.mp4
          ls -la out/

      - name: Render full master audio track from Remotion
        run: |
          npx remotion render src/index.jsx ${{ inputs.composition_id }} out/master_audio.aac \
            --only-audio

      - name: Concatenate video chunks and merge master audio via FFmpeg
        run: |
          # 1. Create FFmpeg concat list for chunk files
          cat << 'EOF' > out/concat_list.txt
          file 'chunk-0.mp4'
          file 'chunk-1.mp4'
          EOF

          # 2. Join video chunks losslessly and bind with master audio
          ffmpeg -y \
            -f concat -safe 0 -i out/concat_list.txt \
            -i out/master_audio.aac \
            -c:v copy \
            -c:a aac -b:a 192k \
            out/final.mp4

          # 3. Apply broadcast loudness normalization (YouTube standard)
          ffmpeg -y \
            -i out/final.mp4 \
            -af loudnorm=I=-14:TP=-1.0:LRA=7 \
            -c:v copy -c:a aac -b:a 192k \
            out/final_broadcast.mp4

          mv out/final_broadcast.mp4 out/final.mp4
          ls -lh out/final.mp4

      - name: Upload Final Rendered Video as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-documentary-video
          path: out/final.mp4
          retention-days: 7
